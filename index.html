<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="home">
            <h1>HOME</h1>
            <h1 id="home-score"  class="score">0</h1>
            <div>
                <button onclick="addHome1()">+1</button>
                <button onclick="addHome2()">+2</button>
                <button onclick="addHome3()">+3</button>
            </div>
        </div>
        <div class="guest">
            <h1>Guest</h1>
            <h1 id="guest-score" class="score">0</h1>
            <div>
                 <button onclick="addGuest1()">+1</button>
                <button onclick="addGuest2()">+2</button>
                <button onclick="addGuest3()">+3</button>
            </div>
        </div>
        <div class="reset">
            <button onclick="resetScore()">Reset</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
